{% extends "base.html" %}
{% block title %}Add Product — Invoicer{% endblock %}
{% block content %}
<h1 class="font-display text-2xl font-semibold mb-6">Add product / service</h1>
<form method="POST" class="bg-surface p-6 rounded-lg border border-line max-w-lg space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1">Name</label>
    <input type="text" name="name" required class="w-full border border-line rounded-md px-3 py-2 bg-surface focus:border-ink outline-none">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Description</label>
    <textarea name="description" class="w-full border border-line rounded-md px-3 py-2 bg-surface focus:border-ink outline-none"></textarea>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1">Unit price</label>
      <input type="number" step="0.01" name="unit_price" required class="w-full border border-line rounded-md px-3 py-2 bg-surface focus:border-ink outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Tax rate (%)</label>
      <input type="number" step="0.01" name="tax_rate" value="0" class="w-full border border-line rounded-md px-3 py-2 bg-surface focus:border-ink outline-none">
    </div>
  </div>
  <button type="submit" class="bg-ink text-paper px-4 py-2 rounded-md font-medium">Save product</button>
</form>
{% endblock %}
