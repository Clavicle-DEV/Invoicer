{% extends "base.html" %}
{% block title %}Add Product — Invoicer{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Add product / service</h1>
<form method="POST" class="bg-white p-6 rounded shadow max-w-lg space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1">Name</label>
    <input type="text" name="name" required class="w-full border rounded px-3 py-2">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">Description</label>
    <textarea name="description" class="w-full border rounded px-3 py-2"></textarea>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1">Unit price</label>
      <input type="number" step="0.01" name="unit_price" required class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Tax rate (%)</label>
      <input type="number" step="0.01" name="tax_rate" value="0" class="w-full border rounded px-3 py-2">
    </div>
  </div>
  <button type="submit" class="bg-gray-900 text-white px-4 py-2 rounded">Save product</button>
</form>
{% endblock %}
