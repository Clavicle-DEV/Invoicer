{% extends "base.html" %}
{% block title %}Log in — Invoicer{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 bg-white p-8 rounded-lg shadow">
  <h1 class="text-2xl font-bold mb-6">Log in</h1>
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" required class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" name="password" required class="w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-gray-900 text-white py-2 rounded hover:bg-gray-800">Log in</button>
  </form>
  <p class="text-sm text-gray-500 mt-4">
    No account? <a href="{{ url_for('auth.register') }}" class="text-blue-600 hover:underline">Register</a>
  </p>
</div>
{% endblock %}
